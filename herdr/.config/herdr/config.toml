# herdr — tmux-like multiplexer with agent status in the sidebar.
# Full commented defaults: `herdr --default-config`. Reload: prefix R.
#
# Model mapping from the tmux setup:
#   tmux session -> herdr workspace (sidebar "Spaces")
#   tmux window  -> herdr tab
#   tmux pane    -> herdr pane
# Keys below mirror tmux.conf wherever herdr has an equivalent action.

onboarding = false

# ── Theme: Catppuccin Macchiato ────────────────────────────────────────
# The built-in "catppuccin" palette is Mocha and there is no Macchiato preset,
# so every colour token is overridden with its Macchiato counterpart.
[theme]
name = "catppuccin"
auto_switch = false         # written by herdr when a theme is picked in settings

[theme.custom]
accent = "#c6a0f6"          # mauve, like the current-window pill in tmux
panel_bg = "#1e2030"        # mantle
active_row_bg = "#363a4f"   # surface0
selection_bg = "#494d64"    # surface1
surface0 = "#363a4f"
surface1 = "#494d64"
surface_dim = "#24273a"     # base
overlay0 = "#6e738d"
overlay1 = "#b8c0e0"          # subtext1, not overlay1: herdr draws tab-bar status text
                            # (the Claude quota) in this token and it has no style option
text = "#cad3f5"
subtext0 = "#a5adcb"
mauve = "#c6a0f6"
green = "#a6da95"
yellow = "#eed49f"
red = "#ed8796"
blue = "#8aadf4"
teal = "#8bd5ca"
peach = "#f5a97f"

[terminal]
new_cwd = "follow"          # like `-c "#{pane_current_path}"` on every split

# ── Keys ───────────────────────────────────────────────────────────────
[keys]
prefix = "ctrl+a"           # prefix twice sends a literal C-a, like send-prefix

# Tabs (tmux windows). prefix 1..9, c, n, p are herdr defaults already.
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"
rename_tab = ["prefix+comma", "prefix+shift+t"]
close_tab = "prefix+shift+x"

# Panes. herdr names splits by the divider: "vertical" = side by side.
split_vertical = ["prefix+|", "prefix+percent", "prefix+v"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
close_pane = "prefix+x"     # no confirmation, same as tmux.conf
zoom = "prefix+z"
last_pane = "prefix+semicolon"
# Alt+hjkl without prefix, as with vim-tmux-navigator. There is no nvim
# integration: inside nvim these move between herdr panes, not nvim splits.
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# Workspaces (tmux sessions).
# prefix s / Alt-s open herdr-navigator (see [[keys.command]] below), which
# also creates workspaces from zoxide dirs like the tmux picker. herdr's own
# picker stays on prefix t as a fallback; settings move from prefix s to S.
workspace_picker = "prefix+t"
settings = "prefix+shift+s"
goto = "prefix+w"           # tree navigator, the closest thing to choose-tree
new_workspace = "prefix+shift+n"
rename_workspace = ["prefix+$", "prefix+shift+w"]
close_workspace = "prefix+shift+d"
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
next_agent = "prefix+a"

# Worktrees: a new workspace grouped under the repo, one per parallel agent.
new_worktree = "prefix+shift+g"
open_worktree = "prefix+shift+o"

detach = ["prefix+d", "prefix+q"]
reload_config = "prefix+shift+r"

# prefix g = lazygit popup, as in tmux. The docs only promise the focused
# pane's cwd for detached shell commands, so cd there explicitly.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "cd \"$HERDR_ACTIVE_PANE_CWD\" && exec lazygit"
description = "lazygit"
width = "90%"
height = "85%"

# ── Plugins (installed by bootstrap.sh; configs in plugins/config/) ──────
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator: jump to or create a workspace"

[[keys.command]]
key = "alt+s"
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator: jump to or create a workspace"

# prefix L = previous workspace, like `sesh last` in tmux.
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "navigator: previous workspace"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: review the agent's diff"

# ── UI ─────────────────────────────────────────────────────────────────
[ui]
prompt_new_tab_name = false # tmux never asks; rename later with prefix ,
status_indicators = "symbols"
sidebar_width = 34          # room for session titles; herdr default is 26
sidebar_max_width = 40
agent_panel_sort = "priority"  # blocked agents first, across all workspaces

# Claude account quota on the right of the tab bar. Status entries cannot be
# coloured (herdr strips styles from command output).
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/claude-quota.sh", interval_seconds = 30, timeout_seconds = 2 },
]
tab_bar_right_separator = "  "

# Claude rows get their own layout; $task, $task2, $model and $ctx are pane
# metadata published by ~/.claude/statusline.sh ($task2 is the second half of
# a title too long for one line). Tokens without a value disappear, and so
# does a row with none left.
[ui.sidebar.agents]
row_gap = 1

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "$task", fg = "#b8c0e0" }],
  [{ token = "$task2", fg = "#b8c0e0" }],
  # From ~/.claude/hooks/herdr-status.sh, reported as state labels so herdr
  # picks the one for the state it detects: waiting / working / finished.
  # herdr's own "idle"/"working"/"done" text (before the first hook event) is
  # hidden. The wrapped rest of a long status is $status2w (activity) or
  # $status2b (waiting); the claude-status plugin keeps only the one matching
  # the current state non-empty.
  [{ token = "state_text", fg = "#8bd5ca", rules = [
    { starts_with = "\uf071", fg = "#f5a97f", bold = true },
    { starts_with = "\uf00c", fg = "#a6da95" },
    { equals = "idle", hide = true },
    { equals = "working", hide = true },
    { equals = "done", hide = true },
    { equals = "blocked", fg = "#f5a97f", bold = true },
  ] }],
  [{ token = "$status2w", fg = "#8bd5ca" }],
  [{ token = "$status2b", fg = "#f5a97f", bold = true }],
  [
    { token = "$model", fg = "#8aadf4" },
    # The bar has one full cell per 10%: 9+ = 90%, 8 = 80%, 5 = 50%.
    { token = "$ctx", fg = "#a6da95", rules = [
      { contains = "━━━━━━━━━", fg = "#ed8796", bold = true },
      { contains = "━━━━━━━━", fg = "#f5a97f" },
      { contains = "━━━━━", fg = "#eed49f" },
    ] },
  ],
]
