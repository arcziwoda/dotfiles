# Keeps the wrapped second row of the Claude status (see
# ~/.claude/hooks/herdr-status.sh) in the colour of the state herdr shows.
# Linked, not installed: `herdr plugin link ~/.config/herdr/local-plugins/claude-status`
# (bootstrap.sh does it).
id = "dotfiles.claude-status"
name = "Claude status colour"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Swap the Claude status continuation row between activity and warning colour on agent state changes"
platforms = ["macos", "linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "apply.sh"]
