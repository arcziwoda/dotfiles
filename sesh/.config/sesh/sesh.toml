#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

# Deliberately declares no sessions.
#
# Sessions are created by typing a new name into the picker, and they persist
# across reboots through tmux-resurrect/continuum — so a list of predeclared
# projects would only duplicate what is already running. The picker asks sesh
# for live tmux sessions only (`sesh list -t`), which also keeps zoxide
# directory history out of it.
#
# Add [[session]] blocks here only if you ever want a project to appear in the
# picker before it has been started even once.

[default_session]
preview_command = "eza --all --git --icons --color=always {}"
