# ── Prefix ─────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Base settings (replaces the unmaintained tmux-sensible) ────────────
set -g mouse on
set -g base-index 1                 # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on          # close a window, the rest close the gap
set -g history-limit 50000
set -g escape-time 10               # 0 breaks some terminals; 500 (default) lags nvim
set -g repeat-time 600
set -g display-time 3000
set -g status-interval 5
set -g focus-events on              # nvim needs these for autoread//FocusGained
setw -g aggressive-resize on
set -g set-clipboard on
set -g detach-on-destroy off        # required by sesh: killing a session keeps you in tmux
set -g status-position bottom

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Pass modified keys through to applications that ask for them (xterm's
# modifyOtherKeys / kitty keyboard protocol). Without this tmux flattens
# Shift+Enter to a plain Enter, so e.g. Claude Code cannot tell them apart.
# The extkeys feature tells tmux that Ghostty itself understands the protocol.
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# ── Windows and panes ──────────────────────────────────────────────────
# Everything inherits the current directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind x
bind x kill-pane                    # no confirmation prompt

bind R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ── Copy mode (vi keys, macOS clipboard) ───────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ── Sessions (sesh) ────────────────────────────────────────────────────
# Same picker as the one on terminal start: live sessions only, and typing a
# name that does not exist creates it.
bind -N "session picker" s display-popup -E -w 70% -h 70% "tmux-sessions"
bind -N "last session" L run-shell "sesh last"

# ── Popups ─────────────────────────────────────────────────────────────
bind -N "lazygit" g display-popup -E -d "#{pane_current_path}" -w 90% -h 85% -T " lazygit " lazygit

# ── Theme: catppuccin v2.3.0 ───────────────────────────────────────────
# Installed manually (upstream recommends this over a plugin manager) and
# pinned to a tag, so the `run` path below is stable.
set -g @catppuccin_flavor "macchiato"
# "none" leaves the status line background unset, which is what lets the
# terminal's own translucency show through it. Any explicit colour here paints
# the cells and makes the bar opaque.
set -g @catppuccin_status_background "none"
# Rounded caps, but written out by hand rather than using the built-in
# "rounded" style. That style draws them as #[fg=<status bg>,reverse], and
# `reverse` swaps foreground with background — so with a transparent bar the
# cell background becomes the default *foreground* colour, leaving a pale
# rectangle around every cap. Setting bg=default explicitly is the only way to
# get a cap floating on a see-through bar.
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[fg=#{@thm_surface_0},bg=default]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "#[fg=#{@thm_overlay_2},bg=default]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_surface_1},bg=default]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_mauve},bg=default]"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

# The session pill gets the same rounded caps: its default right separator is
# a flat full block (█), which reads as a clipped edge next to the rounded
# windows. "no" for the connect separator injects bg=default before each cap,
# keeping them transparent like the window ones above.
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
# Body colour must match the window pills: the module default (surface_0)
# disappears against the translucent bar, which made the right cap invisible
# and the pill look chopped. Trailing space = same padding the windows get.
set -g @catppuccin_status_session_text_bg "#{E:@thm_surface_1}"
set -g @catppuccin_session_text " #S "

run '~/.local/share/tmux/plugins/catppuccin/catppuccin.tmux'

# Status modules must be referenced AFTER catppuccin.tmux has run.
# status-right is deliberately left empty: tmux-continuum appends its periodic
# save hook there, and it misbehaves when it has to re-escape nested formats.
set -g status-left-length 60
# Trailing spaces = the gap between the session pill and the window list (the
# default separator's own trailing space is gone now that it is a bare cap).
set -g status-left "#{E:@catppuccin_status_session}  "
set -g status-right ""


# ── Plugins (tpack, a maintained drop-in for TPM) ──────────────────────
# Plugins live outside this repo on purpose — they are data, not config.
# tpack's own option, so it never probes the TPM-compatibility env vars.
set -g @tpack-plugin-path '~/.local/share/tmux/plugins'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Move pane/split navigation off Ctrl+hjkl onto Alt+hjkl. The default steals
# C-l in the shell — it binds it in the root table and routes it to
# `select-pane -R` — which breaks "clear screen".
set -g @vim_navigator_mapping_left  "M-h"
set -g @vim_navigator_mapping_down  "M-j"
set -g @vim_navigator_mapping_up    "M-k"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_prev  ""
# No longer needed now that plain C-l reaches the shell.
set -g @vim_navigator_prefix_mapping_clear_screen ""

# Save/restore across reboots. Both plugins are unmaintained upstream; a 15
# minute interval limits how often the known empty-overwrite bug can bite.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-fingers is installed via Homebrew, not as a plugin.
set -g @fingers-key F
# Its config parser rejects hex colours, so use ANSI names — the terminal's
# Catppuccin palette maps them to the right hues anyway.
set -g @fingers-highlight-style "fg=red"
set -g @fingers-hint-style "fg=blue,bold"
run 'tmux-fingers load-config'

run 'tpack init'
