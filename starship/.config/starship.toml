"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_macchiato"

# Single line, ending in » (as in the old oh-my-zsh prompt).
format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$java\
${custom.docker_context}\
$cmd_duration\
$character"""

# Blank line above each prompt. Set to false to reclaim the row.
add_newline = true

[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = true
read_only = " "
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[python]
symbol = " "
style = "yellow"
# Shows the active virtualenv name — replaces autoswitch_virtualenv's own output.
format = '[${symbol}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "green"
format = '[$symbol($version )]($style)'

[java]
symbol = " "
style = "peach"
format = '[$symbol($version )]($style)'

[docker_context]
# Replaced by the custom module below. The built-in can only hide the contexts
# named "default" and "desktop-linux", and the everyday context here is
# "orbstack" — so it would be shown permanently, which says nothing.
disabled = true

[custom.docker_context]
description = "Docker context, shown only when it is not the everyday one"
# One script for both, so the decision lives in a single place. It reads
# Docker's config rather than calling `docker context show` (~10ms per prompt).
# Edit SKIP in the script to change which contexts stay hidden.
when = '"$HOME/.config/starship/docker-context.sh"'
command = '"$HOME/.config/starship/docker-context.sh"'
symbol = " "
style = "blue"
format = '[$symbol$output]($style) '

[cmd_duration]
min_time = 2000
style = "peach"
format = "[ $duration]($style) "

[character]
success_symbol = "[»](bold green)"
error_symbol = "[»](bold red)"
vimcmd_symbol = "[«](bold yellow)"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
